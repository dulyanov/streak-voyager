name: iOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest,arch=arm64

jobs:
  build-for-testing:
    name: Build for Testing
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unit-test products once
        shell: bash
        run: |
          set -euo pipefail

          derived_data_path="${RUNNER_TEMP}/DerivedData"

          xcodebuild build-for-testing \
            -project StreakVoyage.xcodeproj \
            -scheme StreakVoyage \
            -destination "${IOS_SIMULATOR_DESTINATION}" \
            -derivedDataPath "${derived_data_path}" \
            -enableCodeCoverage YES \
            -skip-testing:StreakVoyageUITests \
            -only-testing:StreakVoyageTests/WorkoutSessionViewModelTests \
            -only-testing:StreakVoyageTests/HomeProgressStoreTests \
            -only-testing:StreakVoyageTests/StreakVoyageTests \
            -only-testing:StreakVoyageTests/HomeDashboardViewModelTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Remove UI test target from xctestrun
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required to transform .xctestrun files."
            exit 1
          fi

          xctestrun_files=()
          while IFS= read -r file; do
            xctestrun_files+=("${file}")
          done < <(find "${RUNNER_TEMP}/DerivedData/Build/Products" -name "StreakVoyage_StreakVoyage_iphonesimulator*.xctestrun" -print)
          if [[ ${#xctestrun_files[@]} -ne 1 ]]; then
            echo "Expected exactly one matching .xctestrun file after build-for-testing, found ${#xctestrun_files[@]}."
            find "${RUNNER_TEMP}/DerivedData/Build/Products" -name "*.xctestrun" -print || true
            exit 1
          fi
          xctestrun_path="${xctestrun_files[0]}"

          xctestrun_json="${RUNNER_TEMP}/xctestrun.json"
          xctestrun_filtered_json="${RUNNER_TEMP}/xctestrun.filtered.json"

          plutil -convert json -o "${xctestrun_json}" "${xctestrun_path}"
          jq '
            .CodeCoverageBuildableInfos = ((.CodeCoverageBuildableInfos // []) | map(select(.Name != "StreakVoyageUITests.xctest")))
            | .TestConfigurations = (
                (.TestConfigurations // [])
                | map(
                    .TestTargets = (
                      (.TestTargets // [])
                      | map(
                          select(.BlueprintName != "StreakVoyageUITests")
                          | .ParallelizationEnabled = false
                          | .DependentProductPaths = (
                              (.DependentProductPaths // [])
                              | map(
                                  select(
                                    . != "__TESTROOT__/Debug-iphonesimulator/StreakVoyageUITests-Runner.app"
                                    and . != "__TESTROOT__/Debug-iphonesimulator/StreakVoyageUITests-Runner.app/PlugIns/StreakVoyageUITests.xctest"
                                  )
                                )
                            )
                        )
                    )
                  )
              )
          ' "${xctestrun_json}" > "${xctestrun_filtered_json}"

          if jq -e '.TestConfigurations[]?.TestTargets[]? | select(.BlueprintName == "StreakVoyageUITests")' "${xctestrun_filtered_json}" >/dev/null; then
            echo "Failed to remove StreakVoyageUITests target from .xctestrun."
            exit 1
          fi

          if ! jq -e '.TestConfigurations[]?.TestTargets[]? | select(.BlueprintName == "StreakVoyageTests")' "${xctestrun_filtered_json}" >/dev/null; then
            echo "No StreakVoyageTests target found in filtered .xctestrun."
            exit 1
          fi

          plutil -convert xml1 -o "${xctestrun_path}" "${xctestrun_filtered_json}"

      - name: Upload build-for-testing products
        uses: actions/upload-artifact@v4
        with:
          name: build-for-testing-products
          path: ${{ runner.temp }}/DerivedData/Build/Products
          if-no-files-found: error
          retention-days: 1

  test-shards:
    name: Unit Tests (${{ matrix.shard.name }})
    needs: build-for-testing
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UNIT_TEST_RESULT_BUNDLE_PATH: ${{ runner.temp }}/TestResults-${{ matrix.shard.test_group }}.xcresult
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: Core Workout and Store
            test_group: core_tests
          - name: Home Progress Rules
            test_group: home_tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build-for-testing products
        uses: actions/download-artifact@v4
        with:
          name: build-for-testing-products
          path: ${{ runner.temp }}/DerivedData/Build/Products

      - name: Run shard with test-without-building
        shell: bash
        run: |
          set -euo pipefail

          xctestrun_files=()
          while IFS= read -r file; do
            xctestrun_files+=("${file}")
          done < <(find "${RUNNER_TEMP}/DerivedData/Build/Products" -name "StreakVoyage_StreakVoyage_iphonesimulator*.xctestrun" -print)
          if [[ ${#xctestrun_files[@]} -ne 1 ]]; then
            echo "Expected exactly one matching .xctestrun file in downloaded build products, found ${#xctestrun_files[@]}."
            find "${RUNNER_TEMP}/DerivedData/Build/Products" -name "*.xctestrun" -print || true
            exit 1
          fi
          xctestrun_path="${xctestrun_files[0]}"

          test_filters=()
          if [[ "${{ matrix.shard.test_group }}" == "core_tests" ]]; then
            test_filters+=(
              -only-testing:StreakVoyageTests/WorkoutSessionViewModelTests
              -only-testing:StreakVoyageTests/HomeProgressStoreTests
              -only-testing:StreakVoyageTests/StreakVoyageTests
            )
          else
            test_filters+=(-only-testing:StreakVoyageTests/HomeDashboardViewModelTests)
          fi

          rm -rf "${UNIT_TEST_RESULT_BUNDLE_PATH}"

          xcodebuild test-without-building \
            -xctestrun "${xctestrun_path}" \
            -destination "${IOS_SIMULATOR_DESTINATION}" \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -skip-testing:StreakVoyageUITests \
            -resultBundlePath "${UNIT_TEST_RESULT_BUNDLE_PATH}" \
            "${test_filters[@]}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Detect unit test result bundle
        if: always()
        id: detect-unit-result
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d "${UNIT_TEST_RESULT_BUNDLE_PATH}" ]]; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
            echo "path=${UNIT_TEST_RESULT_BUNDLE_PATH}" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
            echo "No unit test result bundle found at ${UNIT_TEST_RESULT_BUNDLE_PATH}"
          fi

      - name: Publish unit test summary
        if: always() && steps.detect-unit-result.outputs.found == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: kishikawakatsumi/xcresulttool@v1
        with:
          path: ${{ steps.detect-unit-result.outputs.path }}
          title: Unit Tests (${{ matrix.shard.name }})
          show-passed-tests: false
          upload-bundles: failure

      - name: Upload unit coverage to Codecov
        if: always() && steps.detect-unit-result.outputs.found == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && (secrets.CODECOV_TOKEN != '' || github.event.repository.private == false)
        uses: codecov/codecov-action@v5
        with:
          directory: ${{ runner.temp }}
          plugins: xcode
          swift_project: StreakVoyage
          flags: ios-unit,${{ matrix.shard.test_group }}
          name: ios-unit-${{ matrix.shard.test_group }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  ui-tests-main:
    name: UI Tests (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      UI_TEST_RESULT_BUNDLE_PATH: ${{ runner.temp }}/TestResults-ui-tests-main.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run UI tests
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${UI_TEST_RESULT_BUNDLE_PATH}"

          xcodebuild test \
            -project StreakVoyage.xcodeproj \
            -scheme StreakVoyage \
            -destination "${IOS_SIMULATOR_DESTINATION}" \
            -only-testing:StreakVoyageUITests \
            -skip-testing:StreakVoyageTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "${UI_TEST_RESULT_BUNDLE_PATH}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Detect UI test result bundle
        if: always()
        id: detect-ui-result
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d "${UI_TEST_RESULT_BUNDLE_PATH}" ]]; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
            echo "path=${UI_TEST_RESULT_BUNDLE_PATH}" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
            echo "No UI test result bundle found at ${UI_TEST_RESULT_BUNDLE_PATH}"
          fi

      - name: Publish UI test summary
        if: always() && steps.detect-ui-result.outputs.found == 'true'
        uses: kishikawakatsumi/xcresulttool@v1
        with:
          path: ${{ steps.detect-ui-result.outputs.path }}
          title: UI Tests (main only)
          show-passed-tests: false
          upload-bundles: failure
